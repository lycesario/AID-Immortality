*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r2:10px;
}
/* ---------- 深色主题（运营 / 企业默认） ---------- */
html[data-theme="dark"]{
  --bg:#080a11; --bg2:#0b0e16; --panel:#10131d; --panel2:#161a26; --elev:#1c2130;
  --line:#1d2331; --line2:#272e40;
  --ink:#e9edf6; --ink2:#98a3b8; --ink3:#5c6880;
  --brand:#5b6cff; --brand2:#8b5cff; --brand-bg:rgba(91,108,255,.14);
  --accent:#5b6cff; --accent2:#8b5cff; --accent-bg:rgba(91,108,255,.14);
  --gold:#f0b90b; --gold-bg:rgba(240,185,11,.11);
  --ok:#0ecb81; --ok-bg:rgba(14,203,129,.11);
  --bad:#f6465d; --bad-bg:rgba(246,70,93,.11);
  --warn:#f0b90b;
  --shadow:0 16px 48px rgba(0,0,0,.5);
  --glow:0 0 24px rgba(91,108,255,.22);
}
/* ---------- 浅色主题（个人中心默认） ---------- */
html[data-theme="light"]{
  --bg:#f5f7fc; --bg2:#eef1f8; --panel:#ffffff; --panel2:#f7f9fd; --elev:#ffffff;
  --line:#e4e9f2; --line2:#d3dae7;
  --ink:#151c2c; --ink2:#586279; --ink3:#93a0b6;
  --brand:#4c5fe0; --brand2:#7a4de0; --brand-bg:rgba(76,95,224,.09);
  --accent:#4c5fe0; --accent2:#7a4de0; --accent-bg:rgba(76,95,224,.09);
  --gold:#b8860b; --gold-bg:rgba(240,185,11,.14);
  --ok:#0aa56a; --ok-bg:rgba(14,203,129,.11);
  --bad:#e0354d; --bad-bg:rgba(246,70,93,.09);
  --shadow:0 14px 40px rgba(28,38,66,.13);
  --glow:0 0 22px rgba(76,95,224,.16);
}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
b,strong{font-weight:650}em{font-style:normal}a{color:inherit;text-decoration:none;cursor:pointer}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局骨架 ---------- */
.wb{display:flex;height:100vh;overflow:hidden}
.side{width:238px;flex:0 0 238px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;overflow-y:auto;padding:22px 26px 70px;position:relative}

/* ---------- 侧栏 ---------- */
.side-brand{display:flex;align-items:center;gap:11px;padding:16px 16px 12px}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:0 0 36px;box-shadow:var(--glow)}
.side-brand b{font-size:14.5px;letter-spacing:.2px;display:block}
.side-brand em{font-size:10.5px;color:var(--ink3);display:block;margin-top:1px}
.role-switch{margin:4px 12px 8px;position:relative}
.role-switch select{width:100%;appearance:none;background:var(--elev);border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:7px 26px 7px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.role-switch:after{content:"\25BE";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;font-size:11px}
.role-switch .rs-lb{font-size:10px;color:var(--ink3);letter-spacing:1.5px;margin-bottom:5px;text-transform:uppercase}
.side-nav{flex:1;overflow-y:auto;padding:4px 10px 14px}
.nav-group{font-size:10px;color:var(--ink3);letter-spacing:1.6px;text-transform:uppercase;padding:14px 8px 5px}
.nav-group .ng-d{font-size:10px;color:var(--ink3);letter-spacing:.2px;text-transform:none;opacity:.75;font-weight:400;display:block;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8.5px 10px;border-radius:9px;color:var(--ink2);font-size:13px;cursor:pointer;margin:1px 0;position:relative;transition:background .15s,color .15s}
.nav-item:hover{background:var(--panel2);color:var(--ink)}
.nav-item.on{background:var(--accent-bg);color:var(--ink);font-weight:600}
.nav-item.on:before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-item .ni{width:18px;text-align:center;font-size:14px;flex:0 0 18px}
.nav-item .cnt{margin-left:auto;font-size:10px;background:var(--bad-bg);color:var(--bad);padding:1px 6px;border-radius:8px;font-family:var(--mono)}
.nav-item.locked{opacity:.38;cursor:not-allowed}
.nav-item.locked:hover{background:none;color:var(--ink2)}
.nav-lock-hint{font-size:9.5px;color:var(--ink3);letter-spacing:1.2px;padding:16px 8px 4px;text-transform:uppercase;border-top:1px dashed var(--line);margin-top:10px}
.side-foot{border-top:1px solid var(--line);padding:10px 14px 12px}
.env-chip{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);margin-bottom:9px}
.env-chip i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.side-user{display:flex;align-items:center;gap:9px}
.uav{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 30px}
.side-user b{font-size:12.5px;display:block}
.side-user em{font-size:10.5px;color:var(--ink3);display:block}

/* ---------- 顶栏 ---------- */
.topbar{height:56px;flex:0 0 56px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:40}
.topnav{display:flex;align-items:center;gap:1px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.topnav::-webkit-scrollbar{display:none}
.tn-item{position:relative;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;color:var(--ink2);font-size:12.5px;font-weight:550;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;flex:0 0 auto}
.tn-item:hover{color:var(--ink);background:var(--panel2)}
.tn-item.on{color:var(--accent);background:var(--accent-bg);font-weight:650}
.tn-item.on:after{content:"";position:absolute;left:13px;right:13px;bottom:-11px;height:2.5px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tn-item.dim{opacity:.42}
.tn-item .tn-badge{font-style:normal;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.top-search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;color:var(--ink3);font-size:12px;cursor:pointer;flex:0 1 auto;width:250px;min-width:0;overflow:hidden}
.top-search .ph{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-search:hover{border-color:var(--line2)}
.top-search kbd{font-family:var(--mono);font-size:10px;background:var(--elev);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--ink3)}
.top-acts{display:flex;gap:8px;align-items:center}
.tb-icon{position:relative;width:32px;height:32px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);border-radius:9px;font-size:14px;cursor:pointer;display:grid;place-items:center;transition:.15s;font-family:inherit}
.tb-icon:hover{color:var(--ink);border-color:var(--accent)}

/* ---------- 面包屑 ---------- */
.subbar{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--bg2);font-size:12px;color:var(--ink2)}
.sub-sp{flex:1}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.crumb .cb-g{color:var(--ink3);font-weight:500;white-space:nowrap}
.crumb .cb-sep{color:var(--ink3);opacity:.6}
.crumb b{font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-right{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--ink3);white-space:nowrap}
.sub-right .cb-role{display:flex;align-items:center;gap:5px}
.sub-right .cb-env{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:10px;letter-spacing:.5px;font-family:var(--mono)}

/* ---------- 通用元件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--elev);color:var(--ink);border-radius:9px;padding:7px 14px;font-size:12.5px;font-family:inherit;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.btn.p:hover{filter:brightness(1.1);color:#fff}
.btn.danger{background:var(--bad-bg);border-color:rgba(246,70,93,.35);color:var(--bad)}
.btn.warn{background:var(--gold-bg);border-color:rgba(240,185,11,.35);color:var(--gold)}
.btn.ok{background:var(--ok-bg);border-color:rgba(14,203,129,.35);color:var(--ok)}
.btn.sm{padding:4px 10px;font-size:11.5px;border-radius:7px}
.btn.lg{padding:10px 22px;font-size:13.5px}
.btn.gh{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.gh:hover{background:var(--panel2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.b{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--gold)}.dot.idle{background:var(--ink3)}
.dot.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* 业务语义色：上升/积极 = 绿，下降/风险 = 红（金融行情场景另遵红涨绿跌） */
.up{color:var(--ok)}
.down{color:var(--bad)}
.ok{color:var(--ok)}
.bad{color:var(--bad)}

/* 面板 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:650}
.panel-h .sub{font-size:11px;color:var(--ink3);font-weight:400;margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-b{padding:16px}
.panel-b.tight{padding:0}
.panel-b.pad0{padding:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;position:relative;overflow:hidden}
.kpi.hl{border-color:var(--accent);box-shadow:var(--glow)}
.kpi .k-lb{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.kpi .k-v{font-size:24px;font-weight:750;letter-spacing:-.8px;margin-top:5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .k-v small{font-size:13px;font-weight:600;color:var(--ink3);margin-left:2px}
.kpi .k-foot{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.kpi .spark{position:absolute;right:10px;bottom:8px;opacity:.9}
.k-pair{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;color:var(--ink3);border:1px dashed var(--line2);border-radius:5px;padding:1px 6px}

/* 表格 */
table.dt{width:100%;border-collapse:collapse;font-size:12.3px}
.dt th{text-align:left;font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:.6px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:2;white-space:nowrap}
.dt td{padding:9.5px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tbody tr{transition:background .12s}
.dt tbody tr:hover{background:var(--panel2)}
.dt tbody tr:last-child td{border-bottom:none}
.dt .r{text-align:right}
.dt .c{text-align:center}
.dt .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dt .link{color:var(--accent);cursor:pointer;font-weight:550}
.dt .link:hover{text-decoration:underline}
.dt tr.rowlink{cursor:pointer}
.tbar{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbar .sp{flex:1}
.inp{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6.5px 11px;font-size:12.3px;font-family:inherit;outline:none;transition:border .15s}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--ink3)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:64px;line-height:1.6}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld>label{font-size:11.5px;color:var(--ink2);font-weight:550}
.fld .hint{font-size:10.5px;color:var(--ink3)}
.fld .req:after{content:" *";color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g2030{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.g3020{display:grid;grid-template-columns:1fr 1.5fr;gap:14px}
.g4-2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center}
.wrap{flex-wrap:wrap}

/* 分页 */
.pager{display:flex;align-items:center;gap:6px;padding:11px 14px;font-size:11.5px;color:var(--ink3)}
.pager .pg{min-width:26px;height:26px;border:1px solid var(--line2);border-radius:7px;display:grid;place-items:center;cursor:pointer;background:var(--elev);font-family:var(--mono)}
.pager .pg.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:650}
.pager .sp{flex:1}

/* 步骤条 / 时间线 */
.stepper{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:6px 0}
.stepper .stp{display:flex;flex-direction:column;align-items:center;min-width:92px;flex:1;position:relative}
.stepper .stp:before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line2)}
.stepper .stp:first-child:before{display:none}
.stepper .stp.done:before{background:var(--ok)}
.stepper .stp .si{width:23px;height:23px;border-radius:50%;background:var(--elev);border:2px solid var(--line2);display:grid;place-items:center;font-size:10.5px;font-family:var(--mono);position:relative;z-index:1;color:var(--ink3)}
.stepper .stp.done .si{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper .stp.act .si{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.stepper .stp.bad .si{border-color:var(--bad);color:var(--bad)}
.stepper .stp span{font-size:10.5px;color:var(--ink3);margin-top:7px;text-align:center;line-height:1.4}
.stepper .stp.act span{color:var(--ink);font-weight:600}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1.5px;background:var(--line2)}
.tl-item{position:relative;padding:0 0 15px 10px}
.tl-item:before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--ink3);border:2px solid var(--panel)}
.tl-item.ok:before{background:var(--ok)}.tl-item.warn:before{background:var(--gold)}
.tl-item.bad:before{background:var(--bad)}.tl-item.brand:before{background:var(--accent)}
.tl-item .tl-t{font-size:12px;font-weight:600}
.tl-item .tl-d{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.65}

/* 提示条 */
.note{display:flex;gap:9px;border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.7;margin-bottom:12px;border:1px solid}
.note .ni{font-size:13px;flex:0 0 16px}
.note.info{background:var(--accent-bg);border-color:rgba(91,108,255,.25)}
.note.ok{background:var(--ok-bg);border-color:rgba(14,203,129,.25)}
.note.warn{background:var(--gold-bg);border-color:rgba(240,185,11,.3)}
.note.bad{background:var(--bad-bg);border-color:rgba(246,70,93,.3)}
.note b{font-weight:650}

/* 合规标注 */
.rule-anno{display:none;border:1.5px dashed var(--gold);background:var(--gold-bg);border-radius:10px;padding:9px 13px;font-size:11.5px;line-height:1.7;margin:8px 0}
.rule-anno b{color:var(--gold)}
.rule-anno .ra-id{font-family:var(--mono);font-weight:700}
.wb.rule-on .rule-anno{display:block}
.wb.rule-on [data-rulechip]{outline:1.5px dashed var(--gold);outline-offset:2px;border-radius:6px}

/* 抽屉 / 模态 / 面板 */
.drawer-mask,.modal-mask,.pal-mask{position:fixed;inset:0;background:rgba(4,6,12,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:80}
.drawer-mask.on,.modal-mask.on,.pal-mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-600px;width:600px;max-width:95vw;height:100vh;background:var(--panel);border-left:1px solid var(--line2);z-index:90;transition:right .28s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{right:0}
.drawer.wide{width:760px}
.drawer-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.drawer-h b{font-size:14.5px}
.drawer-h .x{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink3);border:1px solid var(--line)}
.drawer-h .x:hover{color:var(--ink);border-color:var(--line2)}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px 30px}
.drawer-f{border-top:1px solid var(--line);padding:13px 20px;display:flex;gap:9px;background:var(--panel)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:470px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:16px;z-index:95;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-h{padding:16px 20px 0;font-size:15px;font-weight:700}
.modal-b{padding:14px 20px}
.modal-f{padding:0 20px 18px;display:flex;gap:9px;justify-content:flex-end}
.modal.wide{width:640px}
.palette{position:fixed;left:50%;top:13vh;transform:translateX(-50%) scale(.98);width:580px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:16px;z-index:95;opacity:0;pointer-events:none;transition:.18s;box-shadow:var(--shadow);overflow:hidden}
.palette.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.palette .pal-in{width:100%;background:transparent;border:none;outline:none;color:var(--ink);font-size:14.5px;padding:16px 20px;border-bottom:1px solid var(--line);font-family:inherit}
.pal-list{max-height:46vh;overflow-y:auto;padding:8px}
.pal-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:12.8px;color:var(--ink2)}
.pal-item:hover,.pal-item.on{background:var(--accent-bg);color:var(--ink)}
.pal-item .pi{width:20px;text-align:center}
.pal-item .pk{margin-left:auto;font-size:10px;color:var(--ink3);font-family:var(--mono)}
.pal-empty{padding:26px;text-align:center;color:var(--ink3);font-size:12.5px}

/* Toast */
.toasts{position:fixed;top:16px;right:18px;z-index:120;display:flex;flex-direction:column;gap:9px;max-width:390px}
.toast{display:flex;gap:9px;align-items:flex-start;background:var(--elev);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:11px;padding:11px 15px;font-size:12.5px;box-shadow:var(--shadow);animation:tin .25s ease-out;line-height:1.6}
.toast.ok{border-left-color:var(--ok)}.toast.bad,.toast.err{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* 图表 */
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.heat{display:grid;gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--panel2)}
.progress{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.progress.thin{height:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0);position:relative;flex:0 0 auto}
.ring:after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel)}
.ring>span{position:relative;z-index:1;font-family:var(--mono);font-size:13px;font-weight:700}
.switch{width:34px;height:19px;border-radius:12px;background:var(--line2);position:relative;cursor:pointer;transition:.18s;flex:0 0 34px;display:inline-block;vertical-align:middle}
.switch:after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.18s}
.switch.on{background:var(--ok)}
.switch.on:after{left:17px}
.switch-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.switch-row:last-child{border-bottom:none}
.switch-row .sr-t{flex:1}
.switch-row .sr-t b{font-size:12.5px;display:block;font-weight:600}
.switch-row .sr-t em{font-size:11px;color:var(--ink3);display:block;margin-top:2px;line-height:1.55}
.banner-live{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ok)}
.banner-live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}

/* 杂项 */
.sec-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec-title:first-child{margin-top:0}
.sec-title b{font-size:15px;font-weight:700}
.sec-title em{font-size:11.5px;color:var(--ink3)}
.sec-title .sp{flex:1}
.muted{color:var(--ink3)}
.small{font-size:11.5px}
.tiny{font-size:10.5px}
.divider{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:12.3px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink3);flex:0 0 auto}
.kv .v{text-align:right;word-break:break-all}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:0 0 28px}
.avatar.lg{width:44px;height:44px;font-size:17px;flex:0 0 44px}
.avatar.xl{width:68px;height:68px;font-size:26px;flex:0 0 68px;border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:12.5px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:550}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg span{padding:4px 11px;border-radius:7px;font-size:11.5px;color:var(--ink2);cursor:pointer}
.seg span.on{background:var(--elev);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty .ei{font-size:30px;opacity:.5;display:block;margin-bottom:10px}
.hr-dashed{border-top:1px dashed var(--line);margin:12px 0}

/* hero 头图 */
.hero{position:relative;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(120deg,var(--accent-bg),transparent 62%),var(--panel);padding:20px 22px;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--accent-bg),transparent 70%)}
.hero h1{font-size:19px;font-weight:750;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.hero p{font-size:12.5px;color:var(--ink2);margin-top:6px;max-width:760px;line-height:1.7;position:relative}
.hero .hero-meta{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;position:relative}
.hero .hm{font-size:11px;color:var(--ink3)}
.hero .hm b{display:block;font-size:15px;color:var(--ink);font-family:var(--mono);margin-top:2px}

/* 价格卡 */
.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.price-card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:18px;position:relative;display:flex;flex-direction:column;gap:10px}
.price-card.hl{border-color:var(--accent);box-shadow:var(--glow)}
.price-card .pc-name{font-size:14px;font-weight:700}
.price-card .pc-en{font-size:10px;color:var(--ink3);letter-spacing:1.2px;text-transform:uppercase}
.price-card .pc-amt{font-size:26px;font-weight:750;font-family:var(--mono);letter-spacing:-1px}
.price-card .pc-amt small{font-size:11.5px;color:var(--ink3);font-family:var(--font);font-weight:500}
.price-card ul{list-style:none;display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--ink2)}
.price-card ul li{display:flex;gap:7px;align-items:flex-start;line-height:1.55}
.price-card ul li:before{content:"\2713";color:var(--ok);font-weight:700;flex:0 0 auto}
.price-card .pc-badge{position:absolute;top:-9px;right:14px;font-size:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:2px 9px;border-radius:8px;font-weight:600}

/* 对话气泡 */
.chat{display:flex;flex-direction:column;gap:14px;padding:4px 0}
.bubble{max-width:78%;padding:11px 14px;border-radius:14px;font-size:12.6px;line-height:1.7;position:relative}
.bubble.them{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.bubble.me{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.bubble .b-meta{font-size:10px;opacity:.62;margin-top:7px;display:flex;gap:8px;align-items:center}
.bubble .b-tag{font-size:9.5px;padding:1px 6px;border-radius:6px;background:var(--gold-bg);color:var(--gold);font-weight:600}

/* 设备卡 */
.device{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px;background:var(--panel)}
.device .dv-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--accent-bg);flex:0 0 44px}

/* 组织树 */
.otree{font-size:12.5px}
.otree .ot-node{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer}
.otree .ot-node:hover{background:var(--panel2)}
.otree .ot-node.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.otree .ot-children{padding-left:20px;border-left:1px dashed var(--line2);margin-left:12px}

/* 证书 / 凭据卡 */
.cert{border:1px solid var(--line2);border-radius:var(--r2);padding:16px;background:linear-gradient(135deg,var(--accent-bg),transparent 70%),var(--panel);position:relative;overflow:hidden}
.cert .cert-no{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:1px}
.cert .cert-t{font-size:14px;font-weight:700;margin:6px 0 3px}
.cert .cert-s{font-size:11.5px;color:var(--ink3)}
.cert .cert-seal{position:absolute;right:14px;top:14px;width:52px;height:52px;border-radius:50%;border:1.5px dashed var(--accent);display:grid;place-items:center;font-size:9px;color:var(--accent);text-align:center;line-height:1.2;font-weight:700}

/* 布局辅助 */
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}
.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}
.tc{text-align:center}.tr{text-align:right}
.nowrap{white-space:nowrap}
.fs11{font-size:11px}.fs15{font-size:15px}.fs17{font-size:17px}
.w100{width:100%}
.gap8{gap:8px}.gap16{gap:16px}
.between{display:flex;justify-content:space-between;align-items:center}
.center{display:flex;align-items:center}
.scroll-x{overflow-x:auto}

/* 页面进入过渡 */
.page-in{animation:pageIn .32s cubic-bezier(.25,.8,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 侧栏折叠 */
.wb.folded .side{width:64px;flex:0 0 64px}
.wb.folded .sb-txt{display:none}
.wb.folded .role-switch,.wb.folded .side-brand em{display:none}
.wb.folded .side-brand{justify-content:center;padding:16px 8px 10px}
.wb.folded .nav-item{justify-content:center;padding:9px 0}
.wb.folded .nav-item .cnt{position:absolute;top:2px;right:6px;margin:0;font-size:9px}
.wb.folded .side-foot{padding:10px 8px}
.wb.folded .side-user{justify-content:center}
.wb.folded .top-search .ph{display:none}

/* 登录门 */
.login-mask{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:radial-gradient(1200px 700px at 18% -12%,var(--accent-bg),transparent 60%),
             radial-gradient(900px 620px at 92% 112%,var(--accent-bg),transparent 55%),var(--bg);
  transition:opacity .45s,visibility .45s;overflow:hidden}
.login-mask:before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:26px 26px;opacity:.5}
.login-mask.bye{opacity:0;visibility:hidden}
.login-card{width:410px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:30px 30px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:loginIn .5s cubic-bezier(.2,.9,.3,1);position:relative}
@keyframes loginIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.login-brand b{font-size:16.5px;display:block;letter-spacing:.2px}
.login-brand em{font-size:11px;color:var(--ink3);display:block;margin-top:2px}
.brand-mark.lg{width:44px;height:44px;flex:0 0 44px;border-radius:13px;font-size:22px}
.login-note{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:16px}
.login-foot{margin-top:14px;text-align:center;line-height:1.7}

/* 通知中心 */
.bell-wrap{position:relative}
.bell-badge{display:none;position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;place-items:center;padding:0 4px;font-style:normal}
.bell-panel{position:absolute;right:0;top:42px;width:372px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transform:translateY(-6px);transition:.18s;overflow:hidden}
.bell-wrap.open .bell-panel{opacity:1;pointer-events:auto;transform:none}
.bp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:650}
.bp-item{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.bp-item:hover{background:var(--panel2)}
.bp-item:last-of-type{border-bottom:none}
.bp-item .bp-ic{font-size:16px;width:22px;text-align:center;flex:0 0 22px}
.bp-item b{font-size:12.3px;display:block}
.bp-item.read{opacity:.5}
.bp-f{padding:9px 14px;background:var(--panel2);color:var(--ink3)}

/* 移动端折叠 */
.mobile-only{display:none}
@media (max-width:1240px){
  .g2030,.g3020,.g4-2{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
}
@media (max-width:1080px){
  .grid3{grid-template-columns:1fr 1fr}
  .top-search{width:180px}
}
@media (max-width:900px){
  .side{position:fixed;left:-260px;transition:left .25s;height:100vh}
  .wb.nav-open .side{left:0;box-shadow:var(--shadow)}
  .mobile-only{display:grid}
  .grid2{grid-template-columns:1fr}
  .top-search{display:none}
}

/* ============================================================
   页面级标题 / 补充工具类（个人中心与各平台通用）
   ============================================================ */
.page-t{font-size:19px;font-weight:750;letter-spacing:-.2px;line-height:1.35;margin:0 0 6px}
.page-d{font-size:12.5px;color:var(--ink3);line-height:1.8;margin:0 0 18px;max-width:940px}
.btn.xs{padding:2px 8px;font-size:10.5px;border-radius:6px;gap:4px}
.btn.bad-outline{background:transparent;border-color:rgba(246,70,93,.45);color:var(--bad)}
.btn.bad-outline:hover{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.warn{color:var(--gold)}
.note.warn{color:var(--ink)}

</style>

<body>
<script>
/* ============================================================
   ÆTERNUM · 共享运行引擎（组件库 / 图表库 / 外壳 / 路由 / 交互）
   ============================================================ */
(function(){
'use strict';

/* ---------------- 工具 ---------------- */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
const nf = (n,d) => { if(n==null||n==='') return '—';
  const x = Number(n); if(isNaN(x)) return String(n);
  return x.toLocaleString('zh-CN',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); };
const pct = (n,d) => nf(n,d==null?1:d)+'%';
const money = n => '¥'+nf(n,0);
const wan = n => n>=10000 ? nf(n/10000,1)+' 万' : nf(n,0);
const C_ = { brand:'var(--accent)', ok:'var(--ok)', bad:'var(--bad)', gold:'var(--gold)', ink3:'var(--ink3)', ink2:'var(--ink2)', line:'var(--line2)' };

/* ---------------- 图表库（纯 SVG，无依赖） ---------------- */
const CH = {
  spark(vals, o){
    o = o||{}; const w=o.w||84, h=o.h||26, col=o.color||C_.brand;
    const mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals), rg=(mx-mn)||1;
    const pts = vals.map((v,i)=>[i/(vals.length-1)*w, h-2-((v-mn)/rg)*(h-6)]);
    const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const id='sp'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".34"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  },
  area(dat, o){
    o=o||{}; const w=o.w||640, h=o.h||190, pad={l:38,r:12,t:14,b:24};
    const col=o.color||C_.brand, col2=o.color2||'var(--accent2)';
    const series = o.series||[{k:'', v:dat.map((d,i)=>typeof d==='number'?d:d.v), c:col}];
    const all = series.reduce((a,s)=>a.concat(s.v),[]);
    const mx = o.max||Math.max.apply(null,all)*1.12, mn=0;
    const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b, n=series[0].v.length;
    const X=i=>pad.l+(n===1?iw/2:i/(n-1)*iw);
    const Y=v=>pad.t+ih-((v-mn)/((mx-mn)||1))*ih;
    let g='';
    for(let i=0;i<=4;i++){ const y=pad.t+ih/4*i; const val=mx-(mx/4)*i;
      g+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
      g+=`<text x="${pad.l-6}" y="${y+3.5}" text-anchor="end" font-size="9" fill="var(--ink3)" font-family="var(--mono)">${o.fmtY?o.fmtY(val):nf(val,0)}</text>`; }
    let xs='';
    const lab = o.xlabels||[];
    if(lab.length){ const step=Math.ceil(n/Math.min(n,8));
      lab.forEach((L,i)=>{ if(i%step) return; xs+=`<text x="${X(i)}" y="${h-7}" text-anchor="middle" font-size="9" fill="var(--ink3)">${esc(L)}</text>`; }); }
    let paths='';
    series.forEach((s,si)=>{
      const d=s.v.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
      const id='ar'+si+Math.random().toString(36).slice(2,6);
      paths+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".30"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient></defs>`;
      paths+=`<path d="${d} L${X(n-1)} ${pad.t+ih} L${X(0)} ${pad.t+ih} Z" fill="url(#${id})"/>`;
      paths+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;
      if(o.dots!==false) s.v.forEach((v,i)=>{ if(n<=14) paths+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${s.c}"/>`; });
    });
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">${g}${paths}${xs}</svg>`;
  },
  bars(items, o){
    o=o||{}; const w=o.w||640, h=o.h||200, pad={l:34,r:12,t:14,b:28};
    const col=o.color||C_.brand, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
    const mx=Math.max.apply(null,items.map(d=>d.v))*1.15||1;
    const bw=iw/items.length, gap=bw*0.34;
    let g='';
    for(let i=0;i<=4;i++){ const y=pad.t+ih/4*i; g+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--line)"/>`;
      g+=`<text x="${pad.l-6}" y="${y+3.5}" text-anchor="end" font-size="9" fill="var(--ink3)" font-family="var(--mono)">${nf(mx-(mx/4)*i,0)}</text>`; }
    items.forEach((d,i)=>{
      const x=pad.l+bw*i+gap/2, bh=(d.v/mx)*ih, y=pad.t+ih-bh;

    items.forEach((d,i)=>{

      const p=(a)=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
      const [x1,y1]=p(ang), [x2,y2]=p(e), la=sw>180?1:0;

    let g='';

  },

    o=o||{}; const w=o.w||660, nh=42, gap=12;
    const per=o.per||Math.ceil(nodes.length/Math.ceil(nodes.length/(o.cols||4)));
    let g='', y=4;

      g+=`<text x="${x+cw/2}" y="${yy+18}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">${esc(n.k)}</text>`;
      g+=`<text x="${x+cw/2}" y="${yy+32}" text-anchor="middle" font-size="9" fill="var(--ink3)">${esc(n.s||'')}</text>`;

  }

function render(){

  if(!v){ const first=nav().flatMap(g=>g.items).find(visible); if(first){S.route=first.id; return render();} c.innerHTML=C.empty('无可见页面'); return; }
  c.innerHTML = typeof v.render==='function' ? v.render() : v.render;
  c.scrollTop=0;
  c.classList.remove('page-in'); void c.offsetWidth; c.classList.add('page-in');
  if(v.on) try{ v.on(c); }catch(e){ console.warn(e); }
  renderTopNav(); renderSideNav(); renderCrumb();

function go(id){
  const v=pages()[id];
  if(!v) return;
  const all=nav();
  const gi=all.findIndex(g=>g.items.some(x=>x.id===id));
  if(gi>=0 && !all[gi].items.some(x=>x.id===id&&visible(x))){
    toast('当前角色（'+curRole().n+'）无权访问该页面——最小权限演示','warn'); return;
  }
  S.route=id; if(gi>=0) S.group=gi;
  render();
}
function goGroup(i){
  const cur=nav()[S.group];
  if(i===S.group && cur && cur.items.some(x=>x.id===S.route&&visible(x))) return;
  S.group=i; const g=nav()[i]; const first=g.items.find(visible);
  if(first && (!pages()[S.route] || nav().findIndex(x=>x.items.some(y=>y.id===S.route))!==i)) S.route=first.id;
  render();
}
function switchRole(k){
  S.role=k;
  if(!pages()[S.route]) { const first=nav().flatMap(g=>g.items).find(visible); if(first) S.route=first.id; }
  if(!nav()[S.group].items.some(visible)) S.group=nav().findIndex(g=>g.items.some(visible));

}

function palSearch(q){
  q=(q||'').trim().toLowerCase();

  const pgs=nav().flatMap(g=>g.items).filter(visible).map(i=>({t:i.n,k:'页面',go:i.id,ic:i.i||'▸'}));

    : `<div class="pal-empty">没有找到「${esc(q)}」</div>`;

function palMove(d){ const its=$$('#palList .pal-item'); if(!its.length) return;
  palIdx=(palIdx+d+its.length)%its.length; its.forEach((e,i)=>e.classList.toggle('on',i===palIdx)); its[palIdx].scrollIntoView({block:'nearest'}); }
function palGo(){ const e=$$('#palList .pal-item')[palIdx]; if(!e) return; closePalette(); go(e.dataset.pal); }

/* ---------------- Toast ---------------- */
function toast(msg, kind){
  let box=$('#toasts'); if(!box){ box=document.createElement('div'); box.id='toasts'; box.className='toasts'; document.body.appendChild(box); }
  const d=document.createElement('div'); d.className='toast '+(kind||'');
  d.innerHTML=`<span>${kind==='err'||kind==='bad'?'⛔':kind==='warn'?'⚠':kind==='ok'?'✓':'ⓘ'}</span><div>${msg}</div>`;
  box.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transform='translateX(14px)';d.style.transition='.3s';},3300);
  setTimeout(()=>d.remove(),3700);
}

/* ---------------- 键盘 ---------------- */
document.addEventListener('keydown', function(e){
  const meta=e.metaKey||e.ctrlKey;
  if(meta && (e.key==='k'||e.key==='K')){ e.preventDefault(); 
    if($('#palette').classList.contains('on')) closePalette(); else openPalette(); }
  if(e.key==='Escape'){ closeDrawer(); closeModal(); closePalette(); const w=$('#bellWrap'); if(w) w.classList.remove('open'); }
  if($('#palette').classList.contains('on')){
    const inp=$('#palInput');
    if(e.key==='ArrowDown'){ e.preventDefault(); palMove(1); }
    if(e.key==='ArrowUp'){ e.preventDefault(); palMove(-1); }
    if(e.key==='Enter'){ e.preventDefault(); palGo(); }
    if(inp && e.target!==inp && e.key.length===1){ inp.focus(); }
  }
});
